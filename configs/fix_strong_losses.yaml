# Fix B: Scale-corrected auxiliary loss weights.
#
# Problem: mathematical analysis of the gradient shows that with N=65536:
#   - l_reuse gives dead vectors gradient ≈ 7.6e-8 (lambda × 1/(N×T))
#   - l_reuse gives heavy-hitter vectors gradient ≈ 0.0025 (lambda × N×P/T)
#   - Ratio: heavy hitter gets 33,000× stronger signal than dead vectors
#   - l_util gives ZERO gradient to dead vectors (f_i=0 for never-selected)
#
# Fix: raise lambda_reuse to 0.05 (5× current), lambda_util to 0.001 (5× current).
# Dead vector gradient becomes 3.8e-7 — still small but 5× stronger, and the
# heavy-hitter penalty becomes large enough to matter. Also tighten l_div and l_z
# to prevent the retrieval aspect from concentrating too hard.
#
# This is the "no architecture change" fix — just stronger pressure from existing losses.
name: fix_strong_losses
model:
  D: 4096
  N: 65536
  use_ivf: true
  C: 256
  m: 8
  d_A: 256
  d_B: 256
  r: 4
  k_max: 16
  S: 4
  d_k: 64
  T: 2.0
  n_heads: 4
  n_kv_heads: 1
  use_rope: true
  n_layers_A: 4
  n_layers_B: 4
  ffn_mult: 4
  vocab_size: 32000
  seq_len: 256
  gamma_init: 0.1
  bf16_pool: true
  compute_dtype: bfloat16
  remat: false
  use_flash_attn: false
  vocab_parallel: true
train:
  warmup_steps: 500
  gate_on_steps: 5000
  total_steps: 10000
  lambda_gate_start: 1.0
  lambda_gate_end: 3.0
  lambda_sharpen_end: 10.0
  gate_ramp_steps: 500
  lambda_util: 0.001     # 5× baseline (0.0002): penalise heavy hitters harder
  lambda_reuse: 0.05     # 5× baseline (0.01): stronger gradient to dead vectors
  lambda_div: 0.05       # 5× baseline (0.01): tighter anti-key-collapse pressure
  lambda_norm: 0.0001
  lambda_sparse: 0.0
  lambda_z: 0.02         # 2× baseline: stronger score-magnitude stabilisation
  lambda_keyorth: 0.0
  lambda_vec_div: 0.0
  lr_pool: 1.0e-05
  lr_parts: 5.0e-05
  lr_retrieval: 5.0e-05
  lr_threshold: 5.0e-04
  lr_min_scale: 1.0
  batch_size: 32
  steps_per_window: 16
  seed: 42
  lr_warmup_steps: 500
  ema_decay: 0.99
  grad_clip_norm: 1.0
  nan_emergency_stop: 5
  loss_spike_sigma: 5.0
  dead_vector_threshold: 1.0e-06
  revival_interval_steps: 100
  max_revival_frac: 0.02
  revival_noise_factor: 0.02
sharding:
  n_model: 2
data:
  source: tiny_stories
  hf_path: roneneldan/TinyStories
  hf_text_column: text
  gen_every: 2000
  val_every: 500
  val_batches: 16
checkpoint:
  dir: ''
  every: 0
  resume: false
  keep: 1

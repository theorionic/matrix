# DWA 700M with PQ retrieval — large replicated pool (128K vectors)
#
# PQ requires shard_pool=false (pool replicated per device).
# IVF is disabled; PQ handles retrieval at this pool scale.
#
# Memory per device (n_model=2, 16GB TPU):
#   Pool (N×D bf16):      131072 × 8192 × 2B = 2.0 GB  (replicated)
#   Pool Adam (m+v):      2 × 2.0 GB          = 4.0 GB
#   Transformer (sharded):                    = 0.3 GB
#   Activations budget:   ~9.7 GB             ✓
#
# PQ speedup vs exact:  131K × 64 → 8×256 + 131K×8 = ~16× fewer ops
name: 700m_pool_sharded
model:
  D: 8192
  N: 131072         # 128K — 8× scale-up; replicated pool fits HBM with PQ
  use_ivf: false    # PQ replaces IVF
  use_pq: true
  pq_M: 8           # d_k=64 / 8 = 8-dim subspaces
  pq_K: 256         # max codewords for uint8
  pq_refine: 1024   # exact-cosine candidates after PQ filter
  pq_update_interval: 500
  d_A: 768
  d_B: 768
  r: 4
  k_max: 16
  S: 4
  d_k: 64
  T: 2.0
  n_heads: 6
  n_kv_heads: 1
  use_rope: true
  n_layers_A: 8
  n_layers_B: 8
  ffn_mult: 4
  vocab_size: 32000
  seq_len: 1024
  gamma_init: 0.1
  bf16_pool: true
  compute_dtype: bfloat16
  remat: true
  use_flash_attn: false
  vocab_parallel: true
  shard_transformer: true
  shard_pool: false   # PQ disabled when pool is model-sharded; replicate instead
  use_hypernetwork: false
train:
  warmup_steps: 5000
  gate_on_steps: 20000
  total_steps: 40000
  lambda_gate_start: 1.0
  lambda_gate_end: 3.0
  lambda_sharpen_end: 6.0
  gate_ramp_steps: 500
  lambda_util: 0.0002
  lambda_reuse: 0.01
  lambda_div: 0.01
  lambda_norm: 0.0001
  lambda_sparse: 0.0
  lambda_z: 0.01
  use_adafactor_pool: true  # saves ~2× pool memory; no per-param m/v states
  lr_pool: 1.0e-05
  lr_parts: 5.0e-05
  lr_retrieval: 5.0e-05
  lr_threshold: 5.0e-04
  lr_min_scale: 0.05
  batch_size: 32
  steps_per_window: 100
  seed: 42
  lr_warmup_steps: 1000
  ema_decay: 0.99
  grad_clip_norm: 1.0
  nan_emergency_stop: 5
  loss_spike_sigma: 5.0
  dead_vector_threshold: 1.0e-06
  revival_interval_steps: 1000
  max_revival_frac: 0.05
  revival_noise_factor: 0.1
sharding:
  n_model: 2
data:
  source: hf
  loader: grain
  hf_path: openbmb/Ultra-FineWeb
  hf_subset: ultrafineweb_en
  hf_text_column: content
  hf_tokenizer: gpt2
  val_hf_path: ''
  val_hf_subset: ''
  val_hf_text_column: ''
  gen_every: 2000
  gen_prompts:
    - "The history of artificial intelligence"
    - "In recent years, researchers have discovered"
    - "The most important thing to understand about"
  val_every: 500
  val_batches: 16
checkpoint:
  dir: '/kaggle/working/matrix/checkpoints'
  every: 0
  resume: false
  keep: 3
gdrive:
  enabled: false
